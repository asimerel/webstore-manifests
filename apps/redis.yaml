apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:asimerel/webstore-manifests.git
    targetRevision: main
    path: components/redis
  destination:
    name: in-cluster
    namespace: datastore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
