# flagd — OpenFeature flag daemon for the shop services and the load
# generator. The k6 script gates ALL traffic on browseJourneyEnabled
# (> 0), so without flagd the load generator is a no-op. Image/ports match
# upstream release 3.0.0 (.env: FLAGD_IMAGE, FLAGD_PORT 8013 grpc,
# FLAGD_OFREP_PORT 8016 http/OFREP).
# Flag VALUES are NOT in this repo. The flagd-config ConfigMap mounted below is
# owned by the "flagd-values" Argo Application (apps/flagd-values.yaml), which
# syncs it from asimerel/platform-config (path: flagd-values). To change a
# flag's active variant, open a PR there — one flag change per commit. Do not
# add a competing ConfigMap here: two Applications would fight over the same
# shop/flagd-config object.
# flagd hot-reloads flags.json on ConfigMap change (fsnotify), so a flag flip
# takes effect cluster-wide within ~1 minute of the Argo sync, with no pod
# restart and no deployment-level change to correlate against. When a shop
# service misbehaves with no manifest change, check flagd's logs for a
# "filepath event: /etc/flagd/flags.json" line near the onset.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    opentelemetry.io/name: flagd
    app.kubernetes.io/component: flagd
    app.kubernetes.io/name: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      opentelemetry.io/name: flagd
  template:
    metadata:
      labels:
        opentelemetry.io/name: flagd
        app.kubernetes.io/component: flagd
        app.kubernetes.io/name: flagd
    spec:
      containers:
        - name: flagd
          image: public.ecr.aws/v4z2v9g0/webshop/flagd:v0.16.0
          args:
            - start
            - --uri
            - file:/etc/flagd/flags.json
            # Pin the flag-evaluation gRPC port. Without --port, flagd v0.16.0
            # binds it to an ephemeral port (observed 44543), leaving the
            # Service's 8013 with no listener, so the Rust shipping service's
            # gRPC flagd provider panics at startup. OFREP (8016) is unaffected,
            # which is why this stayed latent until shipping was added.
            - --port
            - "8013"
            - --ofrep-port
            - "8016"
          ports:
            - containerPort: 8013
              name: grpc
            - containerPort: 8016
              name: ofrep
          volumeMounts:
            - name: flagd-config
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: flagd-config
          configMap:
            name: flagd-config
