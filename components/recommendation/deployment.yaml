apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  labels:
    opentelemetry.io/name: recommendation
    app.kubernetes.io/version: 3.0.0
    app.kubernetes.io/component: recommendation
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/part-of: webshop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: recommendation
  template:
    metadata:
      labels:
        opentelemetry.io/name: recommendation
        app.kubernetes.io/version: 3.0.0
        app.kubernetes.io/component: recommendation
        app.kubernetes.io/name: recommendation
      annotations:
        resource.opentelemetry.io/service.namespace: webshop
    spec:
      containers:
      - name: recommendation
        image: public.ecr.aws/v4z2v9g0/webshop/recommendation:2026.09.07.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: service
        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['app.kubernetes.io/component']
        - name: RECOMMENDATION_PORT
          value: '8080'
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:8080
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: 'true'
        - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
          value: python
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_COLLECTOR_NAME
          value: otel-collector.telemetry.svc.cluster.local
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://$(OTEL_COLLECTOR_NAME):4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.version=3.0.0,service.criticality=medium
        resources:
          limits:
            memory: 200Mi
