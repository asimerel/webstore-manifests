apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
  labels:
    opentelemetry.io/name: currency
    app.kubernetes.io/version: 3.0.0
    app.kubernetes.io/component: currency
    app.kubernetes.io/name: currency
    app.kubernetes.io/part-of: webshop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: currency
  template:
    metadata:
      labels:
        opentelemetry.io/name: currency
        app.kubernetes.io/version: 3.0.0
        app.kubernetes.io/component: currency
        app.kubernetes.io/name: currency
      annotations:
        resource.opentelemetry.io/service.namespace: webshop
    spec:
      containers:
      - name: currency
        image: public.ecr.aws/v4z2v9g0/webshop/currency:2026.09.07.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: service
        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['app.kubernetes.io/component']
        - name: CURRENCY_PORT
          value: '8080'
        - name: VERSION
          value: 3.0.0
        - name: IPV6_ENABLED
          value: 'false'
        - name: OTEL_COLLECTOR_NAME
          value: otel-collector.telemetry.svc.cluster.local
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://$(OTEL_COLLECTOR_NAME):4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.version=3.0.0,service.criticality=high
        resources:
          limits:
            memory: 20Mi
