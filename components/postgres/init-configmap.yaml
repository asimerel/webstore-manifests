apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: postgres
# Database bootstrap: creates shop_db + shop_user (static non-secret dev
# credentials for this disposable cluster) and seeds the product catalog. Runs only on first initdb of a fresh PVC --
# every cluster bring-up starts with a fresh PVC, so it always
# applies.
data:
  init.sql: |
    -- Copyright The OpenTelemetry Authors
    -- SPDX-License-Identifier: Apache-2.0
    
    -- Enable pg_stat_statements in the target postgres database
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    
    -- Create application user
    CREATE USER shop_user WITH PASSWORD 'shop_password';
    
    -- Create application database
    CREATE DATABASE shop_db OWNER shop_user;
    
    -- Create monitoring user with pg_monitor role (visibility on all databases and schemas)
    CREATE USER monitoring_user WITH PASSWORD 'monitoring_password';
    GRANT pg_monitor TO monitoring_user;
    
    -- Switch to the application database
    \connect shop_db
    
    -- Enable pg_stat_statements in the application database
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    
    -- Accounting Service: create a schema
    CREATE SCHEMA accounting;
    GRANT USAGE ON SCHEMA accounting TO shop_user;
    
    -- Accounting Service: create tables
    CREATE TABLE accounting."order" (
        order_id TEXT PRIMARY KEY
    );
    
    CREATE TABLE accounting.shipping (
        shipping_tracking_id TEXT PRIMARY KEY,
        shipping_cost_currency_code TEXT NOT NULL,
        shipping_cost_units BIGINT NOT NULL,
        shipping_cost_nanos INT NOT NULL,
        street_address TEXT,
        city TEXT,
        state TEXT,
        country TEXT,
        zip_code TEXT,
        order_id TEXT NOT NULL,
        FOREIGN KEY (order_id) REFERENCES accounting."order"(order_id) ON DELETE CASCADE
    );
    
    CREATE TABLE accounting.orderitem (
        item_cost_currency_code TEXT NOT NULL,
        item_cost_units BIGINT NOT NULL,
        item_cost_nanos INT NOT NULL,
        product_id TEXT NOT NULL,
        quantity INT NOT NULL,
        order_id TEXT NOT NULL,
        PRIMARY KEY (order_id, product_id),
        FOREIGN KEY (order_id) REFERENCES accounting."order"(order_id) ON DELETE CASCADE
    );
    
    -- Accounting Service: grant permission to schema
    GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA accounting TO shop_user;
    
    -- Product Catalog Service: create a schema
    CREATE SCHEMA catalog;
    GRANT USAGE ON SCHEMA catalog TO shop_user;
    
    -- Product Catalog Service: create tables
    CREATE TABLE catalog.products (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT,
        picture TEXT,
        price_currency_code TEXT NOT NULL,
        price_units BIGINT NOT NULL,
        price_nanos INT NOT NULL,
        categories TEXT
    );
    
    -- Product Catalog Service: grant permission to schema
    GRANT SELECT ON ALL TABLES IN SCHEMA catalog TO shop_user;
    
    -- Product Catalog Service: add product data
    INSERT INTO catalog.products (id, name, description, picture, price_currency_code, price_units, price_nanos, categories)
    VALUES
        ('K4NTR1V8QD', 'Cast Iron Skillet', 'A 10-inch pre-seasoned cast iron skillet that goes from stovetop to oven to table. Heats evenly, holds heat, and only gets better with use.', 'CastIronSkillet.jpg', 'USD', 34, 950000000, 'kitchen'),
        ('WQ7ZPL2M9A', 'Ceramic Pour-Over Kettle', 'A 1-litre stovetop kettle with a gooseneck spout for controlled pouring and a built-in thermometer for precise brewing.', 'PourOverKettle.jpg', 'USD', 59, 0, 'kitchen'),
        ('RB3HXD5T7C', 'Packable Travel Blanket', 'A lightweight fleece blanket that folds into its own pouch. Fits in a carry-on and doubles as a pillow.', 'TravelBlanket.jpg', 'USD', 29, 950000000, 'bedding,travel'),
        ('F8YQ2NLV3E', 'Microfiber Cleaning Cloth Set', 'Twelve lint-free microfiber cloths for glass, screens and countertops. Machine washable and reusable hundreds of times.', 'CleaningClothSet.jpg', 'USD', 12, 990000000, 'cleaning'),
        ('T6MJ4CQ9WR', 'Bamboo Cutting Board', 'A large end-grain bamboo board with a juice groove and non-slip feet. Gentle on knives and easy to clean.', 'BambooCuttingBoard.jpg', 'USD', 42, 500000000, 'kitchen'),
        ('HZ2VKD7P4N', 'Smart LED Desk Lamp', 'A dimmable desk lamp with adjustable colour temperature, a USB charging port and a 45-minute auto-off timer.', 'SmartDeskLamp.jpg', 'USD', 64, 0, 'lighting'),
        ('C9XWQ3RM6B', 'Rechargeable Hand Torch', 'A compact 800-lumen torch with three brightness modes and a USB-C rechargeable battery that lasts up to 20 hours.', 'HandTorch.jpg', 'USD', 27, 80000000, 'outdoor,lighting'),
        ('M5DLG8ZT2Y', 'Oak Bookshelf Kit', 'A five-shelf solid oak bookcase shipped flat with all fittings. Assembles in under an hour with the included tools.', 'OakBookshelf.jpg', 'USD', 219, 0, 'furniture,assembly'),
        ('V3PRN6XK8H', 'Linen Table Runner', 'A stonewashed linen runner in natural tones, 180 cm long. Softens with every wash and resists wrinkles.', 'LinenTableRunner.jpg', 'USD', 38, 950000000, 'decor'),
        ('A7SGKJ4E1U', 'The Slow Kitchen Cookbook', 'Ninety seasonal recipes built around one-pot cooking, batch prep and leftovers, with notes on pantry staples.', 'SlowKitchenCookbook.jpg', 'USD', 24, 990000000, 'books');
