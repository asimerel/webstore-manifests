apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    opentelemetry.io/name: cart
    app.kubernetes.io/version: 3.0.0
    app.kubernetes.io/component: cart
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: webshop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: cart
  template:
    metadata:
      labels:
        opentelemetry.io/name: cart
        app.kubernetes.io/version: 3.0.0
        app.kubernetes.io/component: cart
        app.kubernetes.io/name: cart
      annotations:
        resource.opentelemetry.io/service.namespace: webshop
    spec:
      containers:
      - name: cart
        image: public.ecr.aws/v4z2v9g0/webshop/cart:2026.09.07.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: service
        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['app.kubernetes.io/component']
        - name: CART_PORT
          value: '8080'
        - name: ASPNETCORE_URLS
          value: http://*:$(CART_PORT)
        # Redirected off the upstream bundled valkey-cart to the shared redis
        # component (components/redis) deployed cluster-wide into
        # datastore by the "redis" Application.
        - name: VALKEY_ADDR
          value: redis.datastore.svc.cluster.local:6379
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_COLLECTOR_NAME
          value: otel-collector.telemetry.svc.cluster.local
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://$(OTEL_COLLECTOR_NAME):4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.version=3.0.0,service.criticality=high
        resources:
          limits:
            memory: 160Mi
      initContainers:
      - name: wait-for-redis
        image: busybox:latest
        command:
        - sh
        - "-c"
        - until nc -z -v -w30 redis.datastore.svc.cluster.local 6379; do echo waiting for redis.datastore; sleep 2; done;
